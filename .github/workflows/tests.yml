name: Tests
# Runs the actual `numba_enzyme` test suite on every pull request.
#
# LLVM 15 is no longer served by apt.llvm.org for any *current*
# Ubuntu/Debian codename (its supported window has moved on) --
# so this job runs inside a plain debian:trixie container and reuses
# the exact same pinned apt.llvm.org bookworm-15 channel that
# packaging/Dockerfile.manylinux already uses successfully. The
# Enzyme plugin itself is built at enzyme-build/ via
# packaging/build_enzyme_plugin.sh, which is exactly where toolchain.py's
# default resolution already looks -- matching how every dev box
# is already set up, so no NUMBA_ENZYME_PLUGIN_PATH override is
# needed here either.

on:
  pull_request:
  workflow_dispatch:

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  test:
    name: Test
    needs: detect-changes
    if: needs.detect-changes.outputs.tests-relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install LLVM 15 + build tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
              curl gnupg ca-certificates cmake build-essential
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
              | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-15 main" \
              > /etc/apt/sources.list.d/llvm-15.list
          apt-get update && apt-get install -y --no-install-recommends \
              llvm-15-dev clang-15 lld-15
          rm -rf /var/lib/apt/lists/*

      - name: Cache Enzyme plugin build
        uses: actions/cache@v4
        id: enzyme-cache
        with:
          path: enzyme-build
          key: enzyme-v0.0.289-llvm15-${{ runner.os }}

      - name: Build standalone Enzyme plugin
        if: steps.enzyme-cache.outputs.cache-hit != 'true'
        run: bash packaging/build_enzyme_plugin.sh enzyme-build

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run tests
        run: uv run pytest -v

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
