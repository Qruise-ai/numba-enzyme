[project]
name = "numba-autodiff"
version = "0.1.0"
description = "Differentiate Numba-compiled Python functions with the standalone Enzyme LLVM plugin (no Julia)."
requires-python = ">=3.11"
dependencies = [
    "llvmlite==0.44.0",
    "numba==0.61.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numba_enzyme"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01",
    "SA01",
    "EX01",
]
exclude = [
    '\.__init__$',
    '\.__call__$',
    'test_*',
]

[dependency-groups]
dev = [
    "numpydoc>=1.10.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
