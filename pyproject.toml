[project]
name = "numba-autodiff"
version = "0.1.0"
description = "Differentiate Numba-compiled Python functions with the standalone Enzyme LLVM plugin (no Julia)."
requires-python = ">=3.11"
dependencies = [
    "llvmlite==0.44.0",
    "numba==0.61.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numba_enzyme"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
